<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Steam Clone - Biblioteca de Jogos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Steam Clone</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" href="#" data-view="store">Loja</a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-view="library">Biblioteca</a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-view="account">Conta</a></li>
          </ul>
          <div class="d-flex">
            <span id="userDisplay" class="navbar-text text-white me-3">Convidado</span>
            <button id="btnShowLogin" class="btn btn-outline-light btn-sm me-2">Entrar / Registrar</button>
            <button id="btnLogout" class="btn btn-outline-warning btn-sm d-none">Logout</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container">
      <div id="storeView" class="view">
        <h2>Loja</h2>
        <div id="gamesList" class="row gy-3"></div>
      </div>

      <div id="libraryView" class="view d-none">
        <h2>Minha Biblioteca</h2>
        <ul id="libraryList" class="list-group mb-3"></ul>
      </div>

      <div id="accountView" class="view d-none">
        <h2>Conta</h2>
        <div id="accountSection" class="card p-3">
          <p><strong>Usuário:</strong> <span id="accountName">—</span></p>
          <p><strong>Saldo:</strong> R$ <span id="saldoValue">0.00</span></p>
        </div>
      </div>
    </main>

    <!-- Auth Modal -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Entrar / Registrar</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <h6>Entrar</h6>
            <form id="loginForm" class="mb-3">
              <input id="loginEmail" class="form-control mb-2" placeholder="Email" required>
              <input id="loginSenha" type="password" class="form-control mb-2" placeholder="Senha" required>
              <button class="btn btn-primary">Entrar</button>
            </form>

            <hr>
            <h6>Registrar</h6>
            <form id="registerForm">
              <input id="regNome" class="form-control mb-2" placeholder="Nome" required>
              <input id="regEmail" class="form-control mb-2" placeholder="Email" required>
              <input id="regSenha" type="password" class="form-control mb-2" placeholder="Senha" required>
              <button class="btn btn-success">Registrar</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
