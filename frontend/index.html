<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projeto BD - Frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Projeto BD</a>
      </div>
    </nav>

    <main class="container">
      <h1 class="mb-3">Exemplo AJAX com Fetch</h1>

      <section class="mb-4">
        <h4>Adicionar item</h4>
        <form id="addForm" class="row g-2">
          <div class="col-auto">
            <input id="nameInput" class="form-control" placeholder="Nome do item" required>
          </div>
          <div class="col-auto">
            <button class="btn btn-success" type="submit">Adicionar</button>
          </div>
        </form>
      </section>

      <section>
        <h4>Itens</h4>
        <ul id="itemsList" class="list-group"></ul>
      </section>
    </main>

    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
