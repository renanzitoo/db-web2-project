<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Aether - Comunidade</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- TOP HEADER -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo-area" onclick="window.location.href='index.html'">
                <div class="logo-icon"><i class="fa-solid fa-dice-d20"></i></div>
                <span class="logo-text">AETHER</span>
            </div>

            <nav class="nav-links">
                <a href="index.html" class="nav-item">LOJA</a>
                <a href="library.html" class="nav-item">BIBLIOTECA</a>
                <a href="community.html" class="nav-item active" id="nav-community">COMUNIDADE</a>
                <a href="profile.html" class="nav-item">PERFIL</a>
            </nav>

            <div class="user-widget">
                <div class="status-indicator online" id="status-badge" title="Servidor Aether Online">
                    <span class="status-dot"></span>
                    <span class="status-text">ONLINE</span>
                </div>
                <div class="cart-icon-wrapper" onclick="window.location.href='cart.html'">
                    <i class="fa-solid fa-shopping-cart"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </div>
                <div class="wishlist-icon-wrapper" onclick="window.location.href='wishlist.html'" title="Lista de Desejos">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div class="wallet-balance" id="wallet-balance-widget" style="display: none;" onclick="window.location.href='profile.html'">
                    <i class="fa-solid fa-wallet"></i>
                    <span id="wallet-amount">R$ 0,00</span>
                </div>
                <div class="session-ui" id="session-ui-container">
                    <button class="btn btn-login" onclick="window.location.href='login.html'">Iniciar Sessão</button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN VIEWPORT CONTAINER -->
    <main class="main-content" id="community-content-area" style="max-width: 1200px; margin: 25px auto; padding: 0 20px;">
        <div class="loading-container">
            <div class="spinner"></div>
            <p>Carregando feed da comunidade...</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-divider"></div>
            <div class="footer-info">
                <div class="footer-logo"><i class="fa-solid fa-dice-d20"></i> AETHER</div>
                <div class="footer-text">
                    <p>© 2026 Aether Corporation. Todos os direitos reservados. Projeto acadêmico de Banco de Dados e Programação Web II.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- MODAL: ADD FRIEND -->
    <div class="modal-overlay" id="friend-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>ADICIONAR AMIGO</h3>
                <button class="close-btn" id="btn-close-friend-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p class="modal-desc">Digite o ID do usuário que deseja adicionar como amigo:</p>
                <form id="friend-form">
                    <div class="form-group">
                        <label for="friend-id-input">ID DO USUÁRIO</label>
                        <input type="number" id="friend-id-input" required placeholder="Ex: 2" min="1">
                    </div>
                    <div id="friend-error-msg" class="error-text" style="display: none;"></div>
                    <div id="friend-success-msg" class="success-text" style="display: none;"></div>
                    <button type="submit" class="btn btn-primary btn-block">Enviar Solicitação de Amizade</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/common.js"></script>
    <script src="js/community.js"></script>
</body>
</html>
